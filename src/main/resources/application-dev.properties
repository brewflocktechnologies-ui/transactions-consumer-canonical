# =====================================================================
# Dev profile — verbose logging, full error details, all actuator endpoints.
# NEVER use this profile in production. Selected by SPRING_PROFILES_ACTIVE=dev
# (which is the default in application.properties).
# =====================================================================

# ── Verbose logging for app + Spring JDBC + transactions ────────────
logging.level.root=INFO
logging.level.com.poc.transactions_consumer_canonical=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.jdbc.core.namedparam=DEBUG
logging.level.org.springframework.transaction=DEBUG
logging.level.org.flywaydb=INFO

# ── Full error details (NEVER do this in prod) ──────────────────────
server.error.include-stacktrace=on_param
server.error.include-message=always
server.error.include-binding-errors=always

# ── Looser actuator for local debugging ─────────────────────────────
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoints.web.exposure.include=*

# ── Permissive CORS for local SPA development ───────────────────────
app.cors.allowed-origins=*
