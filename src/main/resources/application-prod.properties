# =====================================================================
# Production profile — minimal logging, no PII, masked errors,
# tighter actuator surface. Selected by SPRING_PROFILES_ACTIVE=prod.
#
# CRITICAL: Spring JDBC DEBUG/TRACE will log every bound SQL parameter
# (card numbers, government IDs, DOBs etc.). It MUST stay at WARN or above.
# =====================================================================

# ── Conservative logging ────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.poc.transactions_consumer_canonical=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.jdbc.core=WARN
logging.level.org.springframework.jdbc.core.namedparam=WARN
logging.level.org.springframework.transaction=WARN
logging.level.org.flywaydb=INFO
logging.level.com.zaxxer.hikari=INFO

# ── Never leak internals to clients ─────────────────────────────────
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ── Tighten actuator: health/info/prometheus only, never details ────
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# ── Disable interactive Swagger UI in prod by default ───────────────
# (keep the /v3/api-docs JSON behind authn at the gateway if you want it)
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:false}
springdoc.api-docs.enabled=${OPENAPI_ENABLED:false}

# ── CORS: lock down by default — set CORS_ALLOWED_ORIGINS at deploy ─
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ── Pool sizing for production load (override via env as needed) ────
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL:50}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:10}
