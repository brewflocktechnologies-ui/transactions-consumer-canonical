RECIP_GOVT_ID_URI, RECIP_ACCT_NUM_TYPE, RECIP_CARD_NUM, RECIP_CARD_EXPIR_DT, \
RECIP_ST_LINE1, RECIP_ST_LINE2, RECIP_CITY, RECIP_ST, RECIP_CNTRY_NAM, RECIP_POST_CD, \
