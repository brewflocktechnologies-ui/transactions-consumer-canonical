RECIP_BIRTH_CNTRY_NAM = COALESCE(:recipBirthCntryNam, t.RECIP_BIRTH_CNTRY_NAM), \
RECIP_ACCT_NUM = COALESCE(:recipAcctNum, t.RECIP_ACCT_NUM), \
