SEND_GOVT_ID_URI, SEND_ACCT_NUM_TYPE, SEND_CARD_NUM, SEND_CARD_EXPIR_DT, \
SEND_ST_LINE1, SEND_ST_LINE2, SEND_CITY, SEND_ST, SEND_CNTRY_NAM, SEND_POST_CD, \
