spring.application.name=transactions-consumer-canonical
server.port=8080

# ── Oracle Database ───────────────────────────────
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.username=SEND_TXN_OWNER
spring.datasource.password=Oracle123

# ── Kafka ─────────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=transactions-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ── Logging ───────────────────────────────────────────────
# Application packages — DEBUG shows repo/service trace
logging.level.com.poc.transactions_consumer_canonical=DEBUG

# Spring JDBC — shows SQL statements and parameter values
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.jdbc.core.namedparam=DEBUG

# Transaction manager — shows BEGIN / COMMIT / ROLLBACK
logging.level.org.springframework.transaction=DEBUG

# Log format: timestamp  level  thread  logger  message
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
