# =====================================================================
# Base configuration — env-overridable defaults for local development.
# Profile-specific overrides live in application-dev.properties /
# application-prod.properties.
#
# DO NOT add real secrets here. Sensitive values MUST be provided at
# runtime via environment variables or a secrets manager.
# =====================================================================

spring.application.name=transactions-consumer-canonical
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
server.port=${SERVER_PORT:8080}

# ── HTTP / Server ────────────────────────────────────────────────────
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/xml
server.compression.min-response-size=1KB
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.tomcat.connection-timeout=20s
server.tomcat.threads.max=${SERVER_THREADS_MAX:200}
server.tomcat.accept-count=${SERVER_ACCEPT_COUNT:100}
server.tomcat.max-http-form-post-size=2MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.max-file-size=10MB
# Never expose internal error details by default — overridden in dev profile
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

# ── Jackson (JSON) ───────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.fail-on-empty-beans=false

# ── Oracle Database ──────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${DB_USER:SEND_TXN_OWNER}
spring.datasource.password=${DB_PASS:Oracle123}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
app.db.schema=${APP_DB_SCHEMA:SEND_TXN_OWNER}

# ── HikariCP connection pool ─────────────────────────────────────────
spring.datasource.hikari.pool-name=SendTxnPool
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL:20}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECT_MS:60000}
spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.register-mbeans=true
spring.datasource.hikari.data-source-properties.oracle.jdbc.implicitStatementCacheSize=50
spring.datasource.hikari.data-source-properties.oracle.net.CONNECT_TIMEOUT=10000
spring.datasource.hikari.data-source-properties.oracle.jdbc.ReadTimeout=60000

# ── Database change management ───────────────────────────────────────
# DB creation, DDL migrations, and seed/backfill DML are managed outside
# the application. Startup must not create or mutate database structures.
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=${APP_DB_SCHEMA:SEND_TXN_OWNER}
spring.flyway.default-schema=${APP_DB_SCHEMA:SEND_TXN_OWNER}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.sql.init.mode=never

# ── Kafka ────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:transactions-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ── Springdoc OpenAPI (Swagger UI) ───────────────────────────────────
springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.show-actuator=false

# ── CORS ─────────────────────────────────────────────────────────────
# Comma-separated origins. Default localhost ports for typical SPA dev.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,PUT,POST,DELETE,OPTIONS}
app.cors.max-age-seconds=${CORS_MAX_AGE:3600}

# ── Actuator / Management ────────────────────────────────────────────
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
management.endpoints.web.exposure.exclude=env,beans,configprops,mappings,threaddump,heapdump
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:when-authorized}
management.endpoint.health.show-components=when-authorized
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,500ms,1s,2s,5s
management.observations.key-values.application=${spring.application.name}
management.info.env.enabled=true
management.info.git.mode=full
management.info.build.enabled=true

info.app.name=${spring.application.name}
info.app.description=Send Transactions ingestion service — metadata-driven YAML + generic JDBC engine
info.app.architecture=v1 typed POJO controller + v2 generic metadata-driven controller

# ── Base logging pattern (overridden per profile if a logback config is present) ──
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} [%X{traceId:-}] - %msg%n
