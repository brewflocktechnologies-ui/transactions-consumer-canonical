spring.application.name=transactions-consumer-canonical
server.port=${SERVER_PORT:8080}

# ── Oracle Database ───────────────────────────────
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${DB_USER:SEND_TXN_OWNER}
spring.datasource.password=${DB_PASS:Oracle123}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL:20}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

# ── Kafka ─────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.consumer.group-id=transactions-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ── Actuator / Management ──────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator

# ── Logging ───────────────────────────────────────────────
# Application packages — DEBUG shows repo/service trace
logging.level.com.poc.transactions_consumer_canonical=DEBUG

# Spring JDBC — shows SQL statements and parameter values
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.jdbc.core.namedparam=DEBUG

# Transaction manager — shows BEGIN / COMMIT / ROLLBACK
logging.level.org.springframework.transaction=DEBUG

# Log format: includes traceId MDC key
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} [%X{traceId}] - %msg%n

# App config
app.db.schema=${APP_DB_SCHEMA:SEND_TXN_OWNER}
