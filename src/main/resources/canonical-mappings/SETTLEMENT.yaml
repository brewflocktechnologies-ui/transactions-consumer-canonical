# =============================================================================
# Canonical mapping: SETTLEMENT event type
#
# SETTLEMENT is the 3rd leg of a dual-message-style flow — it merges
# settlement-leg columns into the SAME SEND_TRAN_CLRG_SETLMT row that
# CLEARING already populated (PK = TRAN_ID, so this is a null-guarded
# UPDATE if the row exists, INSERT if not).
#
# Flow (identical to CLEARING):
#   1. KafkaCanonicalConsumer deserialises the payload to a case-insensitive Map<String,Object>
#   2. CanonicalMappingEngine.applyTo(clrgSetlmt mappings, sourceMap, targetMap)
#   3. ClearingEventService verifies the parent SEND_TRANSACTIONS row exists,
#      then MERGEs the targetMap into SEND_TRAN_CLRG_SETLMT.
#
# Source-field renaming workflow:
#   Just change the `source:` value below. No Java changes required — the engine
#   reads the source value from the JSON payload by key (case-insensitive).
#
# Adding a new column to SEND_TRAN_CLRG_SETLMT:
#   See the header of CLEARING.yaml — same 4-step process.
# =============================================================================

eventType: SETTLEMENT
tranIdSource: tranId
tranType: SETTLEMENT
pipeline: CLRG_SETLMT

rules:
  allowedEventSources:
    - SETTLEMENT_SERVICE
    - CLEARING_SERVICE
    - AIS_SERVICE
    - PAYMENT_HUB
  allowedOperations:
    - A
    - U

eventNames:
  - SETTLEMENT
  - SETTLEMENT_INITIATED
  - SETTLEMENT_COMPLETED
  - SETTLEMENT_FAILED
  - SETTLEMENT_REVERSED

# ---------------------------------------------------------------------------
# clrgSetlmt: payload for SEND_TRAN_CLRG_SETLMT (1:1 child, 5th table)
# source: JSON path on the source payload (case-insensitive, dot-notation for nested)
# target: jsonName from metadata/send_tran_clrg_setlmt.yaml
# ---------------------------------------------------------------------------
clrgSetlmt:
  # Clearing status — propagated by upstream so the row stays consistent
  - { source: clearingStatus,         target: clrgSt }
  - { source: clearingDate,           target: clrgDtTs }

  # Settlement leg
  - { source: setlDt,                 target: setlDt }
  - { source: setlAmt,                target: setlAmt }
  - { source: setlCurrCd,             target: setlCurrCd }
  - { source: setlServId,             target: setlServId }
  - { source: setlIca,                target: setlIca }
  - { source: tranFileId,             target: tranFileId }

  # Audit (user)
  - { source: crteUserNam,            target: crteUserNam }
  - { source: updtUserNam,            target: updtUserNam }
