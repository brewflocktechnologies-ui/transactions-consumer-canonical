# =============================================================================
# Canonical mapping: CLEARING event type
#
# CLEARING is the 2nd leg of a dual-message transaction:
#   PAYMENT event  → populates SEND_TRANSACTIONS + 3 child tables
#   CLEARING event → upserts SEND_TRAN_CLRG_SETLMT (the 5th table) for the same tranId
#
# Flow:
#   1. KafkaCanonicalConsumer deserialises the payload to a case-insensitive Map<String,Object>
#   2. CanonicalMappingEngine.applyTo(clrgSetlmt mappings, sourceMap, targetMap)
#   3. ClearingEventService verifies the parent SEND_TRANSACTIONS row exists,
#      then MERGEs the targetMap into SEND_TRAN_CLRG_SETLMT.
#
# Source-field renaming workflow:
#   Just change the `source:` value below. No Java changes required — the engine
#   reads the source value from the JSON payload by key (case-insensitive).
#
# Adding a new column to SEND_TRAN_CLRG_SETLMT:
#   1. Add the column row in metadata/send_tran_clrg_setlmt.yaml
#   2. Add a mapping line below (and/or in SETTLEMENT.yaml) using
#      target: <new jsonName from the metadata YAML>
# =============================================================================

eventType: CLEARING
tranIdSource: tranId
tranType: CLEARING
pipeline: CLRG_SETLMT

rules:
  allowedEventSources:
    - CLEARING_SERVICE
    - AIS_SERVICE
    - PAYMENT_HUB
  allowedOperations:
    - A
    - U

eventNames:
  - CLEARING_INITIATED
  - CLEARING_COMPLETED
  - CLEARING_SETTLED
  - CLEARING_FAILED
  - CLEARING_REVERSED

# ---------------------------------------------------------------------------
# clrgSetlmt: payload for SEND_TRAN_CLRG_SETLMT (1:1 child, 5th table)
# source: JSON path on the source payload (case-insensitive, dot-notation for nested)
# target: jsonName from metadata/send_tran_clrg_setlmt.yaml
# ---------------------------------------------------------------------------
clrgSetlmt:
  # Clearing status & timestamp (DB-enforced NOT NULL)
  - { source: clearingStatus,         target: clrgSt }
  - { source: clearingDate,           target: clrgDtTs }

  # Acquirer / rate / message reason
  - { source: acqRefNumber,           target: acqIcaRefTxt }
  - { source: rateTypeIndicator,      target: rateTypeInd }
  - { source: reasonCode,             target: msgRsnCd }
  - { source: reasonCodeDesc,         target: msgRsnDesc }
  - { source: ichgRateDsgnCd,         target: ichgRateDsgnCd }
  - { source: ichgFee,                target: ichgFee }
  - { source: busnSrvAgmt,            target: busnSrvAgmt }

  # Audit (user)
  - { source: crteUserNam,            target: crteUserNam }
  - { source: updtUserNam,            target: updtUserNam }
