# =====================================================================
# Test profile — in-memory H2 datasource (no Oracle, no Kafka, no Flyway).
# Used by ApplicationContext smoke tests only — production behaviour MUST
# be validated against a real Oracle (Testcontainers / staging).
# =====================================================================

# H2 in-memory — Oracle SQL won't run against this, but it's enough to
# satisfy DataSource / NamedParameterJdbcTemplate bean wiring.
spring.datasource.url=jdbc:h2:mem:test;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Disable Flyway — the V1 migration is Oracle-specific (TO_CLOB, etc.)
spring.flyway.enabled=false

# Disable only Flyway — Kafka autoconfiguration must stay active so KafkaTemplate
# and kafkaListenerContainerFactory beans are created normally. Listeners are
# prevented from connecting by using a non-existent bootstrap address and
# setting auto-startup=false.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# Fake broker — context loads without a real Kafka connection.
# KafkaAdmin.fatalIfBrokerNotAvailable defaults to false, so topic-creation
# failures are silently ignored at startup.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:transactions-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Minimal logging during tests
logging.level.root=WARN
logging.level.com.poc.transactions_consumer_canonical=INFO
logging.level.com.zaxxer.hikari=WARN
