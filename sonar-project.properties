# ======================================================================
# SonarQube project configuration
#
# Primarily used by the Maven plugin (pom.xml sonar.* properties).
# Also serves as a reference for the standalone sonar-scanner CLI.
#
# Maven (recommended):
#   ./mvnw clean verify sonar:sonar -Dsonar.token=<token>
#
# Standalone sonar-scanner CLI (alternative):
#   sonar-scanner -Dsonar.token=<token>
#   (Requires: mvn package first to populate target/classes)
#
# SonarCloud override:
#   ./mvnw clean verify sonar:sonar \
#     -Dsonar.host.url=https://sonarcloud.io \
#     -Dsonar.organization=<your-org> \
#     -Dsonar.token=<token>
# ======================================================================

# ── Project identity ──────────────────────────────────────────────────
sonar.projectKey=transactions-consumer-canonical
sonar.projectName=Transactions Consumer Canonical
sonar.projectVersion=0.0.1-SNAPSHOT

# ── Server ────────────────────────────────────────────────────────────
sonar.host.url=http://localhost:9000

# ── Sources & encoding ────────────────────────────────────────────────
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.sourceEncoding=UTF-8

# ── Compiled bytecode (required by the Java plugin) ──────────────────
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.libraries=target/dependency/*.jar,\
                     ${user.home}/.m2/repository/**/*.jar

# ── Code coverage (generated by: mvn clean verify) ───────────────────
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.java.coveragePlugin=jacoco

# ── Exclusions ────────────────────────────────────────────────────────
# DTOs / models — pure data carriers (Lombok @Data, no testable logic)
# config        — Spring wiring only
# *Application  — main entry point
sonar.exclusions=\
  **/dto/**,\
  **/model/**,\
  **/messagesdto/**,\
  **/*Application.java,\
  **/config/**

sonar.coverage.exclusions=\
  **/dto/**,\
  **/model/**,\
  **/messagesdto/**,\
  **/*Application.java,\
  **/config/**

# Suppress duplicated-code warnings on boilerplate data classes
sonar.cpd.exclusions=**/dto/**,**/model/**,**/messagesdto/**
