name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:

  build-test-sonar:
    name: Build · Test · SonarCloud
    runs-on: ubuntu-latest

    steps:
      # Full history required by SonarCloud for "new code" detection and blame
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Cache SonarCloud scanner downloads between runs
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Single Maven invocation:
      #   clean verify   → compile, run tests, JaCoCo XML report
      #   sonar:sonar    → upload results to SonarCloud
      #
      # Required secrets (Settings → Secrets → Actions):
      #   SONAR_TOKEN  — generated in SonarCloud under My Account → Security
      #   SONAR_ORG    — your SonarCloud organization slug
      - name: Build, test and analyse (SonarCloud)
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORG:   ${{ secrets.SONAR_ORG }}
        run: |
          ./mvnw -B -ntp clean verify sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=${{ env.SONAR_ORG }} \
            -Dsonar.token=${{ env.SONAR_TOKEN }}

      # Fallback when SonarCloud secrets are not set: compile + test only
      - name: Build and test (no Sonar)
        if: ${{ env.SONAR_TOKEN == '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B -ntp clean verify

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  docker-image:
    name: Build Docker image (no push)
    runs-on: ubuntu-latest
    needs: build-test-sonar
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: transactions-consumer-canonical:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
