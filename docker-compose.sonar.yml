# =====================================================================
# SonarQube analysis stack — kept separate from the app stack so it
# does not interfere with local development.
#
# Start:     docker compose -f docker-compose.sonar.yml up -d
# Stop:      docker compose -f docker-compose.sonar.yml down
# Reset:     docker compose -f docker-compose.sonar.yml down -v
#
# Dashboard: http://localhost:9000  (first login: admin / admin)
#
# After SonarQube is UP:
#   1. Log in and change the admin password.
#   2. Create a project key "transactions-consumer-canonical".
#   3. Generate a Project Analysis Token (Settings → Security → Tokens).
#   4. Run the Maven scan from the project root:
#        ./mvnw clean verify sonar:sonar -Dsonar.token=<your-token>
#
# =====================================================================

services:

  # ── PostgreSQL — SonarQube's own metadata store ───────────────────
  sonar-db:
    image: postgres:16-alpine
    container_name: sonar-postgres
    environment:
      POSTGRES_USER:     sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB:       sonarqube
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ── SonarQube Community Edition ───────────────────────────────────
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL:      jdbc:postgresql://sonar-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      # Increase heap if analysing a large project
      SONAR_WEB_JAVAOPTS:  -Xmx512m -Xms128m
      SONAR_CE_JAVAOPTS:   -Xmx512m -Xms128m
    ports:
      - "9000:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    # Required by Elasticsearch (SonarQube's embedded search engine)
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 120s
    restart: unless-stopped

volumes:
  sonar-db-data:
  sonar-data:
  sonar-extensions:
  sonar-logs:
